spring.application.name=WebAppChatbot

# Server Configuration
server.port=8080
server.servlet.context-path=/webapp-chatbot

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/webapp_chatbot?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging Configuration
logging.level.root=INFO
logging.level.backend.webappchatbot=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Jackson Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=UTC

# Application specific properties
app.name=WebAppChatbot
app.version=1.0.0
app.description=Chatbot for Vietnamese student Q&A based on course materials with RAG and Fine-tuning comparison

